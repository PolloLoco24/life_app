<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#F1F3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
/* Shared colours; the dark set follows the phone's light/dark setting. */
:root{color-scheme:light dark;--bg:#F1F3F4;--surface:#fff;--raised:#F1F3F4;--fill:#E8EAED;--line:#DADCE0;--text:#202124;--text2:#5F6368;--muted:#80868B;--onfg:#fff;--ok:#188038;--bad:#D93025;--shadow:rgba(60,64,67,.06);--doneBg:#FFF6DA;--doneLine:#E8C25A;--doneText:#8A6400}
@media (prefers-color-scheme:dark){:root{--bg:#121314;--surface:#1F2023;--raised:#2A2B2E;--fill:#303134;--line:#3C4043;--text:#E8EAED;--text2:#9AA0A6;--muted:#80868B;--onfg:#202124;--ok:#81C995;--bad:#F28B82;--shadow:rgba(0,0,0,.35);--doneBg:rgba(253,214,99,.10);--doneLine:#8A6A12;--doneText:#FDD663}}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font-family:inherit}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;--accent:#202124;--soft:#E8EAED;--btn:#202124;--btnInk:#fff}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 28px) 20px 16px;display:flex;flex-direction:column;gap:18px}
.bottom{padding:0 20px 10px}
nav.tabs{margin:0 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--surface);border-radius:26px;padding:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;box-shadow:0 4px 16px rgba(60,64,67,.10);flex-shrink:0;position:relative}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:20px;font-size:11px;font-weight:800;color:var(--text2);text-decoration:none;position:relative;z-index:1;transition:color .3s}
nav.tabs a.on{color:var(--accent)}
nav.tabs .glide{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 22px) / 6);border-radius:20px;background:var(--soft);transform:translateX(calc(var(--i) * (100% + 2px)));transition:transform .35s cubic-bezier(.3,.7,.2,1)}
/* Animations. "enter" plays when you switch tabs; "pop" only on things that just appeared (see render). */
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tick{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(232,194,90,.55)}to{box-shadow:0 0 0 14px rgba(232,194,90,0)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes selpop{0%{transform:scale(.8)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.scroll.enter>*{animation:enter .34s cubic-bezier(.2,.7,.2,1) both}
.scroll.enter>*:nth-child(2){animation-delay:.03s}.scroll.enter>*:nth-child(3){animation-delay:.06s}
.scroll.enter>*:nth-child(4){animation-delay:.09s}.scroll.enter>*:nth-child(n+5){animation-delay:.12s}
.pop{animation:pop .26s cubic-bezier(.2,.7,.2,1) both}
.toast.pop{animation:toastin .3s cubic-bezier(.2,.8,.2,1) both}
.cal button.pop{animation:selpop .28s cubic-bezier(.3,1.4,.5,1)}
.pop .line{stroke-dasharray:1;animation:draw .9s .1s ease-out both}
.row.ticked{animation:glow .7s ease-out}
.row.ticked .check{animation:tick .4s cubic-bezier(.3,1.5,.5,1)}
.btn,.pill,.tag,.round,.iconbtn,.filterbtn,.textbtn,.seg button,.cal button,.row .hit,.del{transition:transform .12s ease}
.btn:active,.pill:active,.tag:active,.round:active,.iconbtn:active,.filterbtn:active,.seg button:active,.cal button:active,.del:active{transform:scale(.94)}
.row .hit:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{font-size:14px;font-weight:600;color:var(--text2)}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.15}
h2{margin:0;font-size:18px;font-weight:800}
.stat{font-size:14px;font-weight:800;color:var(--accent);padding-bottom:6px;white-space:nowrap}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 2px 8px var(--shadow);display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border-radius:18px;padding:12px 16px;min-height:64px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px var(--shadow);border:2px solid transparent;width:100%;text-align:left;font:inherit;color:inherit}
.row.done{background:var(--doneBg);border-color:var(--doneLine);box-shadow:0 2px 10px rgba(201,151,28,.18)}
.row .hit{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:none;padding:0;text-align:left;color:inherit;cursor:pointer;min-height:44px}
.chip{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.5px}
.row.done .chip{background:#F7D774!important;color:#6B4E00!important}
.rt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rt b{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.rt small{font-size:13px;font-weight:700;color:var(--text2)}
.row.done .rt b{color:var(--doneText)}
.check{width:28px;height:28px;border-radius:14px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row.done .check{background:#B07F0C;border-color:#B07F0C}
.del{width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-right:-8px}
.btn{min-height:48px;border-radius:24px;border:none;font:800 15px Nunito,system-ui,sans-serif;cursor:pointer;padding:0 16px;white-space:nowrap}
.btn.main{background:var(--btn);color:var(--btnInk)}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.dark{background:var(--text);color:var(--surface);min-height:56px;border-radius:28px;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:var(--fill);color:var(--text2);cursor:not-allowed}
.grow{flex:1}
.seg{background:var(--surface);border-radius:18px;padding:5px;display:grid;gap:4px;box-shadow:0 2px 8px var(--shadow)}
.seg button{min-height:44px;border-radius:14px;border:none;background:transparent;color:var(--text2);font:800 15px Nunito,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnInk)}
.pills{display:grid;gap:6px}
.pill{min-height:42px;border-radius:21px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:800 13px Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 8px}
.pill .dot{width:7px;height:7px;border-radius:4px;flex-shrink:0}
.lbl{font-size:14px;font-weight:800;color:var(--text2)}
.field{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font:700 16px Nunito,system-ui,sans-serif;width:100%}
#emo::placeholder{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:var(--text2);padding:2px 0}
.cal button{height:44px;border-radius:14px;border:none;background:transparent;font:800 14px Nunito,system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.cal button.past{color:var(--muted)}
.cal button.today{background:var(--soft);color:var(--accent)}
.cal button.sel{background:var(--btn);color:var(--btnInk)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px;display:block}
.cal button.sel .dots i{background:currentColor!important}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.monthbtn{min-height:40px;border:none;background:transparent;display:flex;align-items:center;gap:6px;font:800 16px Nunito,system-ui,sans-serif;color:var(--text);cursor:pointer;padding:0}
.filterbtn{min-height:40px;padding:0 14px;border-radius:20px;border:none;display:flex;align-items:center;gap:6px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;background:var(--raised);color:var(--text)}
.iconbtn{width:40px;height:40px;border-radius:20px;border:none;background:var(--raised);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.empty{font-size:15px;font-weight:700;color:var(--text2);padding:2px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{border-radius:24px;padding:20px;display:flex;align-items:center;gap:18px;color:#fff;background:#1A73E8}
.ring{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:62px;height:62px;border-radius:31px;background:#1A73E8;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.expand{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.box{background:var(--surface);border-radius:18px;box-shadow:0 2px 8px var(--shadow);display:flex;flex-direction:column}
.box>.hit{display:flex;align-items:center;gap:14px;background:none;border:none;padding:12px 16px;min-height:66px;text-align:left;color:inherit;cursor:pointer;width:100%;font:inherit}
.weekday{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--raised);color:var(--text2)}
.weekday small{font-size:10px;font-weight:800}
.weekday b{font-size:16px;line-height:1}
.weekday.on{background:var(--soft);color:var(--accent)}
.weekday.now{outline:2px solid var(--accent);outline-offset:-2px}
.timerow{display:flex;gap:8px;align-items:center}
.timerow input{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
input[type=time]{-webkit-appearance:none;appearance:none}
.stepper{display:flex;gap:8px;align-items:center}
.stepper .field{text-align:center;font-size:20px;font-weight:800;flex:1;min-width:0}
.round{width:48px;height:48px;border-radius:24px;border:none;background:var(--raised);color:var(--text);font:800 22px Nunito,system-ui,sans-serif;cursor:pointer;flex-shrink:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{min-height:40px;padding:0 14px;border-radius:20px;border:none;background:var(--surface);color:var(--text);font:800 13px Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 6px var(--shadow)}
.tag.on{background:var(--text);color:var(--surface)}
.note{font-size:13px;font-weight:700;color:var(--text2)}
.rowpad{width:74px;flex-shrink:0}
.textbtn{min-height:32px;border:none;background:none;padding:0;font:800 14px Nunito,system-ui,sans-serif;color:var(--accent);cursor:pointer}
a.row{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--text);color:var(--surface);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}
.toast button{background:#FBBC05;color:#202124;border:none;border-radius:16px;min-height:36px;padding:0 14px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'lifeapp-v1';
const CATS = {
  school: { label: 'School', short: 'SCH', fg: '#1A73E8', bg: '#E8F0FE' },
  work:   { label: 'Work',   short: 'WRK', fg: '#188038', bg: '#E6F4EA' },
  gym:    { label: 'Gym',    short: 'GYM', fg: '#D93025', bg: '#FCE8E6' },
  tasks:  { label: 'Tasks',  short: 'TO DO', fg: '#B06000', bg: '#FEF7E0' }
};
const CAT_ORDER = ['school', 'work', 'gym', 'tasks'];
const WK = { push: 'Push', pull: 'Pull', legs: 'Legs' };
const PLANS = {
  push: { focus: 'Chest · Shoulders · Triceps', list: [['Bench press', '4 × 6–8'], ['Overhead press', '3 × 8–10'], ['Incline dumbbell press', '3 × 10'], ['Lateral raises', '3 × 12–15'], ['Tricep pushdowns', '3 × 12']] },
  pull: { focus: 'Back · Biceps', list: [['Barbell rows', '4 × 8'], ['Seated cable row', '3 × 10'], ['Lat pulldown', '3 × 10'], ['Face pulls', '3 × 15'], ['Bicep curls', '3 × 12']] },
  legs: { focus: 'Quads · Hamstrings · Calves', list: [['Squats', '4 × 6–8'], ['Romanian deadlifts', '3 × 8–10'], ['Leg press', '3 × 12'], ['Walking lunges', '3 × 10 each'], ['Calf raises', '4 × 15']] }
};
const SECTIONS = {
  planner: { title: 'Planner', accent: '#202124', soft: '#E8EAED', btn: '#202124', ink: '#fff' },
  tasks:  { title: 'Tasks',  accent: '#B06000', soft: '#FEF7E0', btn: '#FBBC05', ink: '#202124' },
  work:   { title: 'Work',   accent: '#188038', soft: '#E6F4EA', btn: '#188038', ink: '#fff' },
  gym:    { title: 'Gym',    accent: '#D93025', soft: '#FCE8E6', btn: '#D93025', ink: '#fff' },
  school: { title: 'School', accent: '#1A73E8', soft: '#E8F0FE', btn: '#1A73E8', ink: '#fff' },
  news:   { title: 'News',   accent: '#B45309', soft: '#FEEFE3', btn: '#FA7B17', ink: '#202124' }
};
const TAB_ORDER = ['planner', 'tasks', 'work', 'news', 'gym', 'school'];
const NAV_ICONS = {
  planner: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  tasks: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  work: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gym: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  school: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  news: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/>'
};
const FEEDS = [
  { cat: 'wrestling', source: 'Fightful', url: 'https://www.fightful.com/feed/', site: 'https://www.fightful.com' },
  // PWInsider has no working feed of its own, so this is Google News' feed of its last day of articles.
  { cat: 'wrestling', source: 'PWInsider', url: 'https://news.google.com/rss/search?q=site:pwinsider.com+when:1d&hl=en-US&gl=US&ceid=US:en', site: 'https://www.pwinsider.com', strip: ' - PWInsider' },
  { cat: 'wrestling', source: 'WrestleTalk', url: 'https://wrestletalk.com/feed/', site: 'https://wrestletalk.com' },
  { cat: 'games', source: 'IGN', url: 'https://feeds.feedburner.com/ign/all', site: 'https://www.ign.com' },
  { cat: 'games', source: 'GameSpot', url: 'https://www.gamespot.com/feeds/mashup/', site: 'https://www.gamespot.com' },
  { cat: 'games', source: 'GamesRadar+', url: 'https://www.gamesradar.com/feeds.xml', site: 'https://www.gamesradar.com' },
  { cat: 'baseball', source: 'D-backs', url: 'https://www.mlb.com/dbacks/feeds/news/rss.xml', site: 'https://www.mlb.com/dbacks' },
  { cat: 'baseball', source: 'Brewers', url: 'https://www.mlb.com/brewers/feeds/news/rss.xml', site: 'https://www.mlb.com/brewers' }
];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- date helpers (local time) ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
function dayLabel(s) {
  const t = todayStr();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  const d = parse(s);
  return DOW[d.getDay()] + ', ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ', ' + d.getFullYear() : '');
}
function shortDate(s) { const d = parse(s); return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h >= 12 ? 'pm' : 'am');
}
function hoursBetween(a, b) {
  const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d / 60;
}
function timeAgo(iso) {
  const t = new Date(iso.replace(' ', 'T')); if (isNaN(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return Math.max(1, m) + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}

/* ---------- saved data ---------- */
function defaults() {
  return {
    name: 'Rey',
    tasks: [],
    tags: [],
    taskRange: 'month',
    shifts: {},
    school: { term: 'WGU · Term 5', termEnd: '2027-04-30', courses: [
      { code: 'D281', name: 'Linux Foundations', pct: 0 },
      { code: 'D387', name: 'Advanced Java', pct: 0 },
      { code: 'D333', name: 'Ethics in Technology', pct: 0 },
      { code: 'D430', name: 'Intro to InfoSec', pct: 0 }
    ] },
    weights: {},
    plans: Object.fromEntries(Object.entries(PLANS).map(([k, p]) => [k, p.list.map(e => e.slice())])),
    news: { items: [], at: 0 }
  };
}
function load() {
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw) return Object.assign(defaults(), raw); } catch (e) {}
  return defaults();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
if (S.name === 'Ray') { S.name = 'Rey'; save(); }

/* ---------- screen state (not saved) ---------- */
const ui = {
  plannerSel: null, plannerMonth: null, filters: [], filterOpen: false, monthOpen: false, pickY: null,
  taskFilters: [], taskFilterOpen: false, rangeOpen: false, tagsOpen: false, tagForm: null, tagMsg: '',
  sheet: false, editing: null, draft: '', tag: 'tasks', workout: null, emoji: null, repeat: null, pickDate: null, pickMonth: null,
  weekStart: null, workOpen: null, workStart: '09:00', workEnd: '17:00',
  split: null, gymView: 'workout', gymOpen: null, gymDraft: '', gymStart: '', exName: '', addingEx: false, newEx: '', chartEx: null,
  schoolOpen: null, addingClass: false, newCode: '', newName: '',
  newsTab: 'all', newsLoading: false, newsErr: false,
  backupOpen: false, backupMsg: null, restoreText: '',
  undo: null
};

/* ---------- utils ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (d, size = 18, sw = 2.5) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

const customTag = k => S.tags.find(t => t.id === k);

function cat(k) {

  const t = customTag(k); if (!t) return cat('tasks');

  const short = (t.name.length <= 5 ? t.name : t.name.slice(0, 4)).toUpperCase();

}
const emojiAllowed = k => !['school', 'work', 'gym'].includes(k);

/* ---------- tasks: filters and repeats ---------- */
const shown = (c, list = ui.filters) => !list.length || list.includes(c);
const INVERT = 'background:var(--text);color:var(--surface)';
function filterBtn(list, open, action) {
  const st = list.length === 1 ? `background:${cat(list[0]).fg};color:var(--onfg)` : list.length || open ? INVERT : '';
  const label = !list.length ? 'Filter' : list.length === 1 ? cat(list[0]).label : list.length + ' selected';
  return `<button type="button" class="filterbtn" style="${st}" data-a="${action}" aria-expanded="${open}">${svg('<path d="M4 6h16M7 12h10M10 18h4"/>', 16)}${esc(label)}</button>`;
}
// onPage: the pills sit on the grey page rather than inside a white card, so unselected ones need a white fill.
function filterPills(list, action, onPage) {
  const off = onPage ? 'background:var(--surface);border-color:var(--surface)' : 'background:var(--raised);border-color:var(--raised)';
  return `<div class="wrap" data-anim="f-${action}">` + ['all'].concat(allTags()).map(id => {
    const on = id === 'all' ? !list.length : list.includes(id), c = id === 'all' ? null : cat(id);
    const st = !on ? off : c ?`background:${c.fg};border-color:${c.fg};color:var(--onfg)` : INVERT + ';border-color:var(--text)';
    return `<button type="button" class="pill" style="padding:0 14px;${st}" data-a="${action}" data-v="${id}" aria-pressed="${on}">${c ? `<span class="dot" style="background:${on ? 'var(--onfg)' : c.fg}"></span>${esc(c.label)}` : 'All'}</button>`;
  }).join('') + '</div>';
}
const RANGES = { day: 'Today', week: '7 days', month: 'Month', all: 'All' };
// Last date a Tasks range shows. "month" runs to the same date next month (Jan 31 stops at Feb 28/29).
function rangeEnd(t, r) {
  if (r === 'day') return t;
  if (r === 'week') return addDays(t, 6);
  if (r === 'month') { const d = parse(t), last = new Date(d.getFullYear(), d.getMonth() + 2, 0).getDate(); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, Math.min(d.getDate(), last))); }
  return '9999-12-31';
}
// Toggles a tag in a filter list; "all", or every tag selected, means no filter.
function toggledList(list, v) {
  if (v === 'all') return [];
  const next = list.includes(v) ? list.filter(c => c !== v) : list.concat(v);
  return next.length === allTags().length ? [] : next;
}
const REPEAT = { day: 'Every day', week: 'Every week', month: 'Every month' };
// Monthly repeats on, say, the 31st fall on the last day of shorter months.
function occursOn(t, ds) {
  if (!t.repeat) return t.date === ds;
  if (ds < t.date) return false;
  if (t.repeat === 'day') return true;
  if (t.repeat === 'week') return daysBetween(t.date, ds) % 7 === 0;
  const b = parse(ds), last = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
  return b.getDate() === Math.min(parse(t.date).getDate(), last);
}
function nextOn(t, from) {
  if (!t.repeat) return t.date >= from ? t.date : null;
  if (from <= t.date) return t.date;
  if (t.repeat === 'day') return from;
  if (t.repeat === 'week') return addDays(t.date, Math.ceil(daysBetween(t.date, from) / 7) * 7);
  for (let i = 0; i < 32; i++) { const d = addDays(from, i); if (occursOn(t, d)) return d; }
  return null;
}
const isDone = (t, ds) => t.repeat ? (t.doneOn || []).includes(ds) : !!t.done;
// Next date this task still needs doing, from `from` on (null if none).
function nextOpen(t, from) {
  let d = nextOn(t, from);
  while (d && t.repeat && isDone(t, d)) d = nextOn(t, addDays(d, 1));
  return d && !isDone(t, d) ? d : null;
}
// A shift ending at or before its start time (e.g. 10pm–6am) ends the next day.
function shiftEndMs(ds, sh) {
  const [h1, m1] = sh.start.split(':').map(Number), [h2, m2] = sh.end.split(':').map(Number);
  const d = parse(ds); d.setHours(h2, m2, 0, 0);
  if (h2 * 60 + m2 <= h1 * 60 + m1) d.setDate(d.getDate() + 1);
  return d.getTime();
}
const shiftDone = (ds, sh) => Date.now() >= shiftEndMs(ds, sh);
const shiftTimes = sh => fmtTime(sh.start) + ' – ' + fmtTime(sh.end);
const taskSub = t => cat(t.cat).label + (t.workout ? ' · ' + WK[t.workout] : '') + (t.repeat ? ' · ' + REPEAT[t.repeat] : '');

function chip(k, emoji) {
  const c = cat(k);
  return emoji ? `<div class="chip" style="background:${c.bg};font-size:22px;letter-spacing:0" aria-hidden="true">${esc(emoji)}</div>`
    : `<div class="chip" style="background:${c.bg};color:${c.fg}">${esc(c.short)}</div>`;
}
function itemsOn(ds) {
  const out = [];
  const sh = S.shifts[ds];
  if (sh && shown('work')) out.push({ cat: 'work', title: 'Work shift', sub: 'Work · ' + shiftTimes(sh), done: shiftDone(ds, sh) });
  S.tasks.filter(t => shown(t.cat) && occursOn(t, ds))
    .forEach(t => out.push({ cat: t.cat, emoji: t.emoji, title: t.text, sub: taskSub(t), done: isDone(t, ds) }));
  return out;
}
function staticRow(it, key) {
  return `<div class="row${it.done ? ' done' : ''}"${key ? ` data-anim="p-${esc(key)}"` : ''}>${chip(it.cat, it.emoji)}<div class="rt"><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></div>${it.done ? `<div class="check" role="img" aria-label="Done">${CHECK}</div>` : ''}</div>`;

function calendar(y, m, opts) {
  const first = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate(), t = todayStr();
  let h = '<div class="cal">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="wd" aria-hidden="true">${d}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let d = 1; d <= count; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d);
    const cls = [ds === opts.sel ? 'sel' : '', ds === t ? 'today' : '', ds < t ? 'past' : ''].join(' ');
    const dots = opts.dots ? opts.dots(ds) : [];
    h += `<button type="button" class="${cls}" data-a="${opts.action}" data-v="${ds}"${ds === opts.sel ? ` data-anim="sel-${opts.action}-${ds}"` : ''} aria-label="${dayLabel(ds)}"${opts.disablePast && ds < t ? ' disabled' : ''}>${d}${opts.dots ? `<span class="dots">${dots.map(c => `<i style="background:${cat(c).fg}"></i>`).join('')}</span>` : ''}</button>`;
  }
  return h + '</div>';
}

function restoreBackup(text) {
  let b;
  try { b = JSON.parse(text); } catch (e) { b = null; }
  const d = b && b.app === 'lifeapp-backup' && b.data;
  if (!d || !Array.isArray(d.tasks) || typeof d.shifts !== 'object' || !d.school || !Array.isArray(d.school.courses) || typeof d.weights !== 'object') {
    ui.backupMsg = { ok: false, text: 'That doesn’t look like a Planner backup, so nothing was changed.' }; return;
  }
  const when = new Date(b.savedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  if (!confirm(`Replace everything in Planner with the backup from ${when}? This can’t be undone.`)) { ui.backupMsg = { ok: false, text: 'Restore cancelled. Nothing was changed.' }; return; }
  S = Object.assign(defaults(), d, { news: S.news }); save();
  ui.restoreText = ''; ui.backupMsg = { ok: true, text: `Restored the backup from ${when}.` };
}

const LOGOS = {
  dbacks: ['logos/dbacks.svg', '#fff', 4], brewers: ['logos/brewers.svg', '#fff', 4],
  wwe: ['logos/wwe.svg', '#202124', 7], aew: ['logos/aew.svg', '#202124', 4],
  nintendo: ['logos/nintendo.svg', '#E60012', 2], playstation: ['logos/playstation.svg', '#fff', 6]
};
const LOGO_RULES = {
  // Case-sensitive on purpose ("raw" the word isn't the show), with ALL-CAPS variants for PWInsider-style headlines.
  wrestling: [['wwe', /\b(WWE|wwe|Wwe)\b|\b(Raw|RAW)\b|SmackDown|SMACKDOWN|\bNXT\b|WrestleMania|WRESTLEMANIA|Survivor Series|SURVIVOR SERIES|Royal Rumble|ROYAL RUMBLE|SummerSlam|SUMMERSLAM|Crown Jewel|CROWN JEWEL/],
              ['aew', /\b(AEW|aew|Aew)\b|Dynamite|DYNAMITE|Blood & Guts|BLOOD & GUTS|Full Gear|FULL GEAR|Double or Nothing|DOUBLE OR NOTHING|Forbidden Door|FORBIDDEN DOOR/],
              ['other', /\b(TNA|MLW|GCW|NJPW|ROH|NWA|AAA|CMLL|Stardom|STARDOM)\b|Indies|INDIES|Lucha|LUCHA/]],
  games: [['nintendo', /Nintendo|Switch 2|Zelda|Mario|Pok[eé]mon|Yoshi|Kirby|Metroid|Donkey Kong|Splatoon|Animal Crossing|Smash Bros/i],
          ['playstation', /PlayStation|\bPS[45]\b|PS Plus|DualSense|\bSony\b/i]]
};
// The brand named first in the headline wins; otherwise fall back to the site's own tags.
// Games tags naming several platforms usually mean a multi-platform story, so those get no logo.
// 'other' marks a non-WWE/AEW promotion named first, which also means no logo.
function newsLogo(n) { const k = pickLogo(n); return k === 'other' ? null : k; }
function pickLogo(n) {
  if (n.cat === 'baseball') return n.source.startsWith('Brewers') ? 'brewers' : 'dbacks';
  const rules = LOGO_RULES[n.cat] || [];
  let best = null, at = Infinity;
  rules.forEach(([k, re]) => { const i = n.title.search(re); if (i > -1 && i < at) { at = i; best = k; } });
  if (best) return best;
  const found = [];
  (n.tags || []).forEach(t => rules.forEach(([k, re]) => { if (re.test(t) && !found.includes(k)) found.push(k); }));
  return n.cat === 'games' && found.length > 1 ? null : found[0] || null;
}
// rss2json gives times in UTC without saying so; read them as UTC, not local time.
function newsTime(n) { const s = (n.date || '').replace(' ', 'T'); return Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z'); }
const DAY_MS = 24 * 60 * 60 * 1000;
function newsScreen() {
  const tab = ui.newsTab;

  const inTab = S.news.items.filter(n => (tab === 'all' || n.cat === tab) && FEEDS.some(f => f.source === n.source));
  inTab.filter(n => Date.now() - newsTime(n) < DAY_MS).forEach(n => {
    const key = n.title.trim().toLowerCase(), prev = seen.get(key);
    if (!prev) { const copy = { ...n }; seen.set(key, copy); items.push(copy); }
    else if (!prev.source.split(' & ').includes(n.source)) prev.source += ' & ' + n.source;
  });
  const tabs = [['all', 'All'], ['wrestling', 'Wrestling'], ['games', 'Games'], ['baseball', 'Baseball']];
  const CHIP = darkMQ.matches
    ? { wrestling: ['WREST', 'background:rgba(252,173,112,.16);color:#FCAD70'], games: ['GAMES', 'background:rgba(138,180,248,.16);color:#8AB4F8'], baseball: ['MLB', 'background:rgba(129,201,149,.16);color:#81C995'] }
    : { wrestling: ['WREST', 'background:#FEEFE3;color:#B45309'], games: ['GAMES', 'background:#E8F0FE;color:#1A73E8'], baseball: ['MLB', 'background:#E6F4EA;color:#188038'] };
  let body;
  if (items.length) body = items.map(n => `<a class="row" data-anim="n-${esc(n.link)}" href="${esc(n.link)}" target="_blank" rel="noopener">
      ${(lg => lg ? `<div class="chip" style="background:${lg[1]}!important;padding:${lg[2]}px;box-shadow:inset 0 0 0 1px var(--line)"><img src="${lg[0]}" alt="" style="width:100%;height:100%;object-fit:contain"></div>`
        : `<div class="chip" style="${(CHIP[n.cat] || CHIP.games)[1]}">${(CHIP[n.cat] || CHIP.games)[0]}</div>`)(LOGOS[newsLogo(n)])}
      <div class="rt"><b style="line-height:1.3">${esc(n.title)}</b><small>${esc(n.source)}${n.date ? ' · ' + timeAgo(new Date(newsTime(n)).toISOString()) : ''}</small></div></a>`).join('');
  else if (ui.newsLoading) body = '<div class="empty">Loading headlines…</div>';
  else body = `<div class="empty">${ui.newsErr ? 'Couldn’t load headlines right now. You can open the sites directly:' : inTab.length ? 'Nothing new in the last 24 hours. You can open the sites directly:' : 'No headlines yet.'}</div>
    <div class="wrap">${FEEDS.filter(f => tab === 'all' || f.cat === tab).map(f => `<a class="tag" style="display:flex;align-items:center;text-decoration:none" href="${f.site}" target="_blank" rel="noopener">${f.source}</a>`).join('')}</div>`;
  return `<div class="scroll">
    <header class="head"><div><div class="sub">${S.news.at ? 'Updated ' + timeAgo(new Date(S.news.at).toISOString()) : 'Wrestling · Games · Baseball'}</div><h1>News</h1></div>
      <button type="button" class="iconbtn" style="background:var(--surface);margin-bottom:2px" data-a="refreshNews" aria-label="Refresh headlines">${svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', 18)}</button></header>
    <div class="seg" style="grid-template-columns:repeat(${tabs.length},minmax(0,1fr))">${tabs.map(([id, l]) => `<button type="button" class="${tab === id ? 'on' : ''}" data-a="newsTab" data-v="${id}" aria-pressed="${tab === id}">${l}</button>`).join('')}</div>
    ${(down => down.length && !ui.newsLoading ? `<div class="note" style="color:var(--bad);margin-top:-8px">${down.length} source${down.length === 1 ? '' : 's'} not loading right now: ${down.map(esc).join(', ')}</div>` : '')(
      FEEDS.filter(f => (tab === 'all' || f.cat === tab) && (S.news.failed || []).includes(f.source)).map(f => f.source))}
    <section class="list">${body}</section>
  </div>`;
}

/* ---------- news loading ---------- */
// Free rss2json key: lifts the "new feeds" block and allows more than 10 stories per feed. It's public by necessity.
const RSS2JSON_KEY = 'wy3xvp5y6kgtbqep', PER_FEED = 30;
async function loadNews(force) {
  if (ui.newsLoading) return;
  const haveSources = new Set(S.news.items.map(n => n.source));
  if (!force && S.news.items.length && Date.now() - S.news.at < 60 * 60 * 1000 && FEEDS.every(f => haveSources.has(f.source))) return;
  if (!force && ui.newsTried && Date.now() - ui.newsTried < 10 * 60 * 1000) return;
  ui.newsTried = Date.now();
  ui.newsLoading = true; ui.newsErr = false; render();
  const results = await Promise.allSettled(FEEDS.map(f =>
    fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url) + '&api_key=' + RSS2JSON_KEY + '&count=' + PER_FEED)
      .then(r => r.json())
      .then(j => {
        if (j.status !== 'ok') throw new Error(j.message || 'feed failed');
        return j.items.slice(0, PER_FEED).map(it => {
          const d = document.createElement('textarea'); d.innerHTML = it.title || '';
          if (f.strip && d.value.endsWith(f.strip)) d.value = d.value.slice(0, -f.strip.length);
          const tags = (Array.isArray(it.categories) ? it.categories : []).filter(c => typeof c === 'string').slice(0, 10);
          return { cat: f.cat, source: f.source, title: d.value, link: it.link, date: it.pubDate || '', tags };
        });
      })));
  const fresh = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value).filter(i => i.title && /^https?:/.test(i.link || ''));
  // A source that failed this time keeps the headlines it had before.
  const failed = FEEDS.filter((f, i) => results[i].status === 'rejected').map(f => f.source);
  const items = fresh.concat(S.news.items.filter(n => failed.includes(n.source)));
  items.sort((a, b) => newsTime(b) - newsTime(a));
  if (fresh.length) S.news = { items: items.slice(0, FEEDS.length * PER_FEED), at: Date.now(), failed };
  else { ui.newsErr = true; S.news.failed = FEEDS.map(f => f.source); }
  save();
  ui.newsLoading = false; render();
}

/* ---------- actions ---------- */
const A = {
  planSel: v => { ui.plannerSel = v; },
  toggleFilter: () => { ui.filterOpen = !ui.filterOpen; ui.monthOpen = false; },
  setFilter: v => { ui.filters = toggledList(ui.filters, v); },
  toggleTaskFilter: () => { ui.taskFilterOpen = !ui.taskFilterOpen; ui.rangeOpen = false; },
  toggleRange: () => { ui.rangeOpen = !ui.rangeOpen; ui.taskFilterOpen = false; },
  setRange: v => { S.taskRange = v; save(); ui.rangeOpen = false; },
  setTaskFilter: v => { ui.taskFilters = toggledList(ui.taskFilters, v); },

  toggleTags: () => { ui.tagsOpen = !ui.tagsOpen; ui.tagForm = null; ui.tagMsg = ''; },
  newTag: () => {
    const used = S.tags.map(t => t.color), color = Object.keys(TAG_COLORS).find(k => !used.includes(k)) || 'purple';
    ui.tagForm = { id: null, name: '', color }; ui.tagsOpen = false; ui.tagMsg = '';
    setTimeout(() => { const el = document.getElementById('tagname'); if (el) el.focus(); }, 50);
  },
  editTag: v => { const t = customTag(v); if (t) { ui.tagForm = { id: t.id, name: t.name, color: t.color }; ui.tagsOpen = false; ui.tagMsg = ''; } },
  tagColor: v => { ui.tagForm.color = v; },
  cancelTag: () => { ui.tagForm = null; ui.tagMsg = ''; },
  saveTag: () => {
    const f = ui.tagForm, name = f.name.trim().replace(/\s+/g, ' ');
    if (!name) { ui.tagMsg = 'Give the tag a name.'; return; }
    const taken = Object.values(CATS).map(c => c.label).concat(S.tags.filter(t => t.id !== f.id).map(t => t.name));
    if (taken.some(n => n.toLowerCase() === name.toLowerCase())) { ui.tagMsg = `There’s already a tag called “${name}”.`; return; }
    if (f.id) Object.assign(customTag(f.id), { name, color: f.color });
    else { const id = 'tag_' + uid(); S.tags.push({ id, name, color: f.color }); A.setTag(id); }
    save(); ui.tagForm = null; ui.tagMsg = '';
  },
  deleteTag: v => {
    const t = customTag(v); if (!t) return;
    const n = S.tasks.filter(x => x.cat === v).length;
    if (!confirm(`Delete the “${t.name}” tag?${n ? ` Its ${n} task${n === 1 ? '' : 's'} will move to the Tasks tag.` : ''}`)) return;
    S.tasks.forEach(x => { if (x.cat === v) x.cat = 'tasks'; });
    S.tags = S.tags.filter(x => x.id !== v);
    ui.filters = ui.filters.filter(c => c !== v); ui.taskFilters = ui.taskFilters.filter(c => c !== v);
    if (ui.tag === v) ui.tag = 'tasks';
    save(); ui.tagForm = null; ui.tagMsg = '';
  },
  toggleMonth: () => { const n = new Date(); ui.monthOpen = !ui.monthOpen; ui.filterOpen = false; ui.pickY = (ui.plannerMonth || { y: n.getFullYear() }).y; },
  pickYear: v => { ui.pickY += Number(v); },
  pickMonth: v => { ui.plannerMonth = { y: ui.pickY, m: Number(v) }; ui.monthOpen = false; ui.plannerSel = ui.pickY + '-' + pad(Number(v) + 1) + '-01'; },
  goToday: () => { ui.plannerMonth = null; ui.plannerSel = null; ui.monthOpen = false; },

  openSheet: () => { Object.assign(ui, { sheet: true, editing: null, draft: '', pickDate: todayStr(), pickMonth: null, workout: null, emoji: null, repeat: null, tagsOpen: false, tagForm: null, tagMsg: '' }); A._focusSheet(); },
  editTask: v => {
    const x = S.tasks.find(t => t.id === v); if (!x) return;
    Object.assign(ui, { sheet: true, editing: x.id, draft: x.text, tag: customTag(x.cat) || CATS[x.cat] ? x.cat : 'tasks', workout: x.workout || null, emoji: x.emoji || null, repeat: x.repeat || null, pickDate: x.date, pickMonth: null, tagsOpen: false, tagForm: null, tagMsg: '' });
    A._focusSheet();
  },
  _focusSheet: () => setTimeout(() => { const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; const el = document.getElementById('draft'); if (el) el.focus(); }, 50),
  closeSheet: () => { ui.sheet = false; ui.editing = null; ui.tagForm = null; ui.tagsOpen = false; },
  setTag: v => { ui.tag = v; if (v !== 'gym') ui.workout = null; if (!emojiAllowed(v)) ui.emoji = null; },
  setWorkout: v => { ui.workout = v; },
  setRepeat: v => { ui.repeat = v || null; },
  pickDate: v => { ui.pickDate = v; },
  sheetMonth: v => {
    const base = ui.pickMonth || { y: parse(ui.pickDate || todayStr()).getFullYear(), m: parse(ui.pickDate || todayStr()).getMonth() };
    const d = new Date(base.y, base.m + Number(v), 1); ui.pickMonth = { y: d.getFullYear(), m: d.getMonth() };
  },
  addTask: () => {
    if (ui.tag === 'gym' && !ui.workout) return;
    const wk = ui.tag === 'gym' ? ui.workout : null;
    const text = ui.draft.trim() || (wk ? WK[wk] + ' day' : 'New task');
    const fields = { text, date: ui.pickDate || todayStr(), cat: ui.tag, workout: wk,
      emoji: emojiAllowed(ui.tag) && ui.emoji ? ui.emoji : undefined, repeat: ui.repeat || undefined };
    const existing = ui.editing && S.tasks.find(t => t.id === ui.editing);
    if (existing) Object.assign(existing, fields);
    else S.tasks.push({ id: uid(), ...fields, done: false, created: Date.now() });
    const x = existing || S.tasks[S.tasks.length - 1];
    if (x.repeat && !x.doneOn) x.doneOn = [];
    save(); Object.assign(ui, { sheet: false, editing: null, draft: '', workout: null, emoji: null, repeat: null });
  },
  // data-v is "id|date" so a repeating task can be ticked off for just that date.
  toggleTask: v => {
    const [id, ds] = v.split('|'), x = S.tasks.find(t => t.id === id); if (!x) return;
    if (x.repeat) x.doneOn = isDone(x, ds) ? x.doneOn.filter(d => d !== ds) : (x.doneOn || []).concat(ds);
    else x.done = !x.done;
    if (isDone(x, ds)) ui.justTicked = v;
    save();
  },
  delTask: v => {
    const i = S.tasks.findIndex(t => t.id === v); if (i < 0) return;
    if (ui.editing === v) { ui.sheet = false; ui.editing = null; }
    ui.undo = { task: S.tasks[i], at: i }; S.tasks.splice(i, 1); save(); A._undoTimer();
  },
  undo: () => {
    if (!ui.undo) return;
    if (ui.undo.ex) S.plans[ui.undo.split].splice(ui.undo.at, 0, ui.undo.ex);
    else S.tasks.splice(ui.undo.at, 0, ui.undo.task);
    ui.undo = null; save();
  },
  _undoTimer: () => { clearTimeout(A._u); A._u = setTimeout(() => { ui.undo = null; render(); }, 5000); },

  week: v => { ui.weekStart = addDays(ui.weekStart || weekStartOf(todayStr()), Number(v)); ui.workOpen = null; },
  openDay: v => { if (ui.workOpen === v) { ui.workOpen = null; return; } ui.workOpen = v; const s = S.shifts[v]; ui.workStart = s ? s.start : '09:00'; ui.workEnd = s ? s.end : '17:00'; },  saveShift: v => { if (ui.workStart && ui.workEnd) { S.shifts[v] = { start: ui.workStart, end: ui.workEnd }; save(); } ui.workOpen = null; },
  clearShift: v => { delete S.shifts[v]; save(); ui.workOpen = null; },

  setSplit: v => { ui.split = v; ui.gymView = 'workout'; ui.gymOpen = null; ui.addingEx = false; },
  gymView: v => { ui.gymView = v; ui.gymOpen = null; ui.addingEx = false; },
  chartEx: v => { ui.chartEx = v; },
  startEx: () => { ui.addingEx = true; ui.newEx = ''; ui.gymOpen = null; setTimeout(() => { const el = document.getElementById('nex'); if (el) el.focus(); }, 50); },
  cancelEx: () => { ui.addingEx = false; },
  addEx: () => { const n = ui.newEx.trim(); if (!n) return; S.plans[curSplit()].push([n, '']); ui.addingEx = false; save(); },
  openEx: v => {
    const i = Number(v); ui.addingEx = false; if (ui.gymOpen === i) { ui.gymOpen = null; return; }
    const n = S.plans[curSplit()][i][0], w = curWeight(n);
    ui.gymOpen = i; ui.exName = n; ui.gymDraft = ui.gymStart = w == null ? '' : String(w);
  },
  step: v => { ui.gymDraft = String(Math.max(0, (Number(ui.gymDraft) || 0) + Number(v))); },
  saveEx: v => {
    const ex = S.plans[curSplit()][Number(v)], old = ex[0];
    const name = ui.exName.trim() || old;
    if (name !== old && S.weights[old]) {
      // Carry the weight history over to the new name; keep the old key if another workout still uses it.
      S.weights[name] = (S.weights[name] || []).concat(S.weights[old]).sort((a, b) => a.date.localeCompare(b.date));
      if (!Object.values(S.plans).some(l => l.some(e => e !== ex && e[0] === old))) delete S.weights[old];
    }
    ex[0] = name;
    const w = Number(ui.gymDraft);
    if (ui.gymDraft !== ui.gymStart && ui.gymDraft !== '' && !isNaN(w)) {
      const h = S.weights[name] = S.weights[name] || []; const t = todayStr(), last = h[h.length - 1];
      if (last && weekStartOf(last.date) === weekStartOf(t)) { last.w = w; last.date = t; } else h.push({ date: t, w });
    }
    save(); ui.gymOpen = null;
  },
  delEx: v => {
    const split = curSplit(), at = Number(v);
    ui.undo = { ex: S.plans[split][at], split, at }; S.plans[split].splice(at, 1);
    save(); ui.gymOpen = null; A._undoTimer();
  },

  openClass: v => { ui.schoolOpen = ui.schoolOpen === Number(v) ? null : Number(v); },
  classPass: v => { S.school.courses[v].pct = 100; save(); },
  classReset: v => { S.school.courses[v].pct = 0; save(); },
  classDel: v => { S.school.courses.splice(Number(v), 1); ui.schoolOpen = null; save(); },
  startClass: () => { ui.addingClass = true; ui.newCode = ''; ui.newName = ''; },
  cancelClass: () => { ui.addingClass = false; },
  addClass: () => { if (!ui.newCode.trim() && !ui.newName.trim()) return; S.school.courses.push({ code: ui.newCode.trim().toUpperCase() || '—', name: ui.newName.trim() || 'New class', pct: 0 }); ui.addingClass = false; save(); },

  newsTab: v => { ui.newsTab = v; },
  refreshNews: () => { loadNews(true); },

  backupOpen: () => { ui.backupOpen = true; ui.backupMsg = null; },
  backupClose: () => { ui.backupOpen = false; ui.backupMsg = null; },
  backupSave: () => {
    const name = `planner-backup-${todayStr()}.json`;
    const file = new File([backupJson()], name, { type: 'application/json' });
    const done = (ok, text) => { ui.backupMsg = { ok, text }; render(); };
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Planner backup' })
        .then(() => done(true, 'Backup saved. Keep the file somewhere safe, like Files or iCloud Drive.'))
        .catch(e => done(false, e && e.name === 'AbortError' ? 'Backup not saved.' : 'Couldn’t share the backup. Try Copy instead.'));
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      ui.backupMsg = { ok: true, text: `Downloaded ${name}.` };
    }
  },
  backupCopy: () => {
    navigator.clipboard.writeText(backupJson())
      .then(() => { ui.backupMsg = { ok: true, text: 'Backup copied. Paste it somewhere safe, like a note in Notes.' }; render(); })
      .catch(() => { ui.backupMsg = { ok: false, text: 'Couldn’t copy. Try Save backup file instead.' }; render(); });
  },
  restorePaste: () => { if (!ui.restoreText.trim()) { ui.backupMsg = { ok: false, text: 'Paste a backup into the box first.' }; return; } restoreBackup(ui.restoreText); }
};
const CHANGE = {
  daysLeft: el => { const n = Math.max(0, parseInt(el.value, 10) || 0); S.school.termEnd = addDays(todayStr(), n); save(); },
  classPct: el => { S.school.courses[el.dataset.v].pct = Number(el.value); save(); },
  restoreFile: el => { const f = el.files && el.files[0]; el.value = ''; if (f) f.text().then(t => { restoreBackup(t); render(); }); }
};

/* ---------- render ---------- */
const app = document.getElementById('app');
function render() {
  const r = route(), sec = section(r);
  const keepScroll = render._route === r ? (app.querySelector('.scroll') || {}).scrollTop : 0;
  app.style.setProperty('--accent', sec.accent); app.style.setProperty('--soft', sec.soft);
  app.style.setProperty('--btn', sec.btn); app.style.setProperty('--btnInk', sec.ink);
  document.title = sec.title;
  const screen = { planner, tasks: tasksScreen, work: workScreen, gym: gymScreen, school: schoolScreen, news: newsScreen }[r]();
  const oldPill = app.querySelector('nav.tabs .glide');
  const fromX = oldPill ? new DOMMatrix(getComputedStyle(oldPill).transform).m41 : null;
  const nav = `<nav class="tabs" aria-label="Sections"><span class="glide" style="--i:${TAB_ORDER.indexOf(r)}"></span>${TAB_ORDER.map(k => `<a href="#${k}" class="${k === r ? 'on' : ''}"${k === r ? ' aria-current="page"' : ''}>${svg(NAV_ICONS[k], 22, 2)}${SECTIONS[k].title}</a>`).join('')}</nav>`;
  const toast = ui.undo ? `<div class="toast" role="status" data-anim="toast">${ui.undo.ex ? 'Exercise' : 'Task'} deleted<button type="button" data-a="undo">Undo</button></div>` : '';
  app.innerHTML = screen + nav + toast;
  // The nav is rebuilt every render, so start the new pill where the old one was and let it slide.
  const pill = app.querySelector('nav.tabs .glide');
  if (fromX !== null) { pill.style.transform = `translateX(${fromX}px)`; pill.getBoundingClientRect(); pill.style.transform = ''; }
  const sc = app.querySelector('.scroll'); if (sc && keepScroll) sc.scrollTop = keepScroll;
  // Everything is rebuilt on each render, so only animate what wasn't on screen last time.
  const seen = render._anims || new Set(), shownNow = new Set();
  app.querySelectorAll('[data-anim]').forEach(el => {
    shownNow.add(el.dataset.anim);
    if (render._route === r && !seen.has(el.dataset.anim)) el.classList.add('pop');
  });
  if (render._route !== r && sc) sc.classList.add('enter');
  render._anims = shownNow;
  ui.justTicked = null;
  render._route = r;
  render._timeKey = timeKey();
  if (r === 'news') loadNews(false);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.v, el); render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) ui[el.dataset.bind] = el.value;
  // Updates the box in place (no re-render) so the emoji keyboard stays open.
  if (el.id === 'tagname' && ui.tagForm) ui.tagForm.name = el.value;
  if (el.id === 'emo') { const e = pickEmoji(el.value); ui.emoji = e || null; if (el.value !== e) el.value = e; }
  if (el.dataset.change === 'classPct') { const l = document.getElementById('prl'); if (l) l.textContent = el.value; }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CHANGE[el.dataset.change]) { CHANGE[el.dataset.change](el); render(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'draft' && !(ui.tag === 'gym' && !ui.workout)) { A.addTask(); render(); }
  if (e.target.id === 'tagname') { e.preventDefault(); A.saveTag(); render(); }
  if (e.target.id === 'nex') { A.addEx(); render(); }
});
window.addEventListener('hashchange', () => { ui.filterOpen = ui.monthOpen = false; render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
darkMQ.addEventListener('change', render);
// Redraw when a shift ends or the day changes while the app is open — but not mid-typing.
function timeKey() {
  const t = todayStr();
  return t + Object.keys(S.shifts).filter(ds => ds >= addDays(t, -1) && ds <= addDays(t, 1)).map(ds => ds + shiftDone(ds, S.shifts[ds])).join();
}
setInterval(() => {
  const typing = document.activeElement && document.activeElement.matches('input, textarea, select');
  if (!document.hidden && !typing && timeKey() !== render._timeKey) render();
}, 30000);
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Check for a new version whenever the app comes back to the front, and reload once when it takes over.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
}
