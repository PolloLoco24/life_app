<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#F1F3F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F1F3F4}
body{color:#202124;font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font-family:inherit}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;--accent:#202124;--soft:#E8EAED;--btn:#202124;--btnInk:#fff}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 28px) 20px 16px;display:flex;flex-direction:column;gap:18px}
.bottom{padding:0 20px 10px}
nav.tabs{margin:0 12px calc(env(safe-area-inset-bottom) + 10px);background:#fff;border-radius:26px;padding:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;box-shadow:0 4px 16px rgba(60,64,67,.10);flex-shrink:0;position:relative}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:20px;font-size:11px;font-weight:800;color:#5F6368;text-decoration:none;position:relative;z-index:1;transition:color .3s}
nav.tabs a.on{color:var(--accent)}
nav.tabs .glide{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 22px) / 6);border-radius:20px;background:var(--soft);transform:translateX(calc(var(--i) * (100% + 2px)));transition:transform .35s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){nav.tabs .glide,nav.tabs a{transition:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{font-size:14px;font-weight:600;color:#5F6368}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.15}
h2{margin:0;font-size:18px;font-weight:800}
.stat{font-size:14px;font-weight:800;color:var(--accent);padding-bottom:6px;white-space:nowrap}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 8px rgba(60,64,67,.06);display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:#fff;border-radius:18px;padding:12px 16px;min-height:64px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(60,64,67,.06);border:2px solid transparent;width:100%;text-align:left;font:inherit;color:inherit}
.row.done{background:#FFF6DA;border-color:#E8C25A;box-shadow:0 2px 10px rgba(201,151,28,.18)}
.row .hit{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:none;padding:0;text-align:left;color:inherit;cursor:pointer;min-height:44px}
.chip{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.5px}
.row.done .chip{background:#F7D774!important;color:#6B4E00!important}
.rt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rt b{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.rt small{font-size:13px;font-weight:700;color:#5F6368}
.row.done .rt b{color:#8A6400}
.check{width:28px;height:28px;border-radius:14px;border:2px solid #DADCE0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row.done .check{background:#B07F0C;border-color:#B07F0C}
.del{width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:#80868B;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-right:-8px}
.btn{min-height:48px;border-radius:24px;border:none;font:800 15px Nunito,system-ui,sans-serif;cursor:pointer;padding:0 16px;white-space:nowrap}
.btn.main{background:var(--btn);color:var(--btnInk)}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.dark{background:#202124;color:#fff;min-height:56px;border-radius:28px;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:#E8EAED;color:#5F6368;cursor:not-allowed}
.grow{flex:1}
.seg{background:#fff;border-radius:18px;padding:5px;display:grid;gap:4px;box-shadow:0 2px 8px rgba(60,64,67,.06)}
.seg button{min-height:44px;border-radius:14px;border:none;background:transparent;color:#5F6368;font:800 15px Nunito,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnInk)}
.pills{display:grid;gap:6px}
.pill{min-height:42px;border-radius:21px;border:2px solid #DADCE0;background:#fff;color:#202124;font:800 13px Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 8px}
.pill .dot{width:7px;height:7px;border-radius:4px;flex-shrink:0}
.lbl{font-size:14px;font-weight:800;color:#5F6368}
.field{min-height:48px;border-radius:14px;border:2px solid #DADCE0;background:#fff;color:#202124;padding:0 14px;font:700 16px Nunito,system-ui,sans-serif;width:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:#5F6368;padding:2px 0}
.cal button{height:44px;border-radius:14px;border:none;background:transparent;font:800 14px Nunito,system-ui,sans-serif;color:#202124;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.cal button.past{color:#80868B}
.cal button.today{background:var(--soft);color:var(--accent)}
.cal button.sel{background:var(--btn);color:var(--btnInk)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px;display:block}
.cal button.sel .dots i{background:currentColor!important}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.monthbtn{min-height:40px;border:none;background:transparent;display:flex;align-items:center;gap:6px;font:800 16px Nunito,system-ui,sans-serif;color:#202124;cursor:pointer;padding:0}
.filterbtn{min-height:40px;padding:0 14px;border-radius:20px;border:none;display:flex;align-items:center;gap:6px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;background:#F1F3F4;color:#202124}
.iconbtn{width:40px;height:40px;border-radius:20px;border:none;background:#F1F3F4;color:#202124;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.empty{font-size:15px;font-weight:700;color:#5F6368;padding:2px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{border-radius:24px;padding:20px;display:flex;align-items:center;gap:18px;color:#fff;background:#1A73E8}
.ring{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:62px;height:62px;border-radius:31px;background:#1A73E8;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.expand{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.box{background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(60,64,67,.06);display:flex;flex-direction:column}
.box>.hit{display:flex;align-items:center;gap:14px;background:none;border:none;padding:12px 16px;min-height:66px;text-align:left;color:inherit;cursor:pointer;width:100%;font:inherit}
.weekday{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#F1F3F4;color:#5F6368}
.weekday small{font-size:10px;font-weight:800}
.weekday b{font-size:16px;line-height:1}
.weekday.on{background:var(--soft);color:var(--accent)}
.weekday.now{outline:2px solid var(--accent);outline-offset:-2px}
.timerow{display:flex;gap:8px;align-items:center}
.timerow input{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
input[type=time]{-webkit-appearance:none;appearance:none}
.stepper{display:flex;gap:8px;align-items:center}
.stepper .field{text-align:center;font-size:20px;font-weight:800;flex:1;min-width:0}
.round{width:48px;height:48px;border-radius:24px;border:none;background:#F1F3F4;color:#202124;font:800 22px Nunito,system-ui,sans-serif;cursor:pointer;flex-shrink:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{min-height:40px;padding:0 14px;border-radius:20px;border:none;background:#fff;color:#202124;font:800 13px Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 6px rgba(60,64,67,.06)}
.tag.on{background:#202124;color:#fff}
.note{font-size:13px;font-weight:700;color:#5F6368}
a.row{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#202124;color:#fff;border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}
.toast button{background:#FBBC05;color:#202124;border:none;border-radius:16px;min-height:36px;padding:0 14px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'lifeapp-v1';
const CATS = {
  school: { label: 'School', short: 'SCH', fg: '#1A73E8', bg: '#E8F0FE' },
  work:   { label: 'Work',   short: 'WRK', fg: '#188038', bg: '#E6F4EA' },
  gym:    { label: 'Gym',    short: 'GYM', fg: '#D93025', bg: '#FCE8E6' },
  tasks:  { label: 'Tasks',  short: 'TO DO', fg: '#B06000', bg: '#FEF7E0' }
};
const CAT_ORDER = ['school', 'work', 'gym', 'tasks'];
const WK = { push: 'Push', pull: 'Pull', legs: 'Legs' };
const PLANS = {
  push: { focus: 'Chest · Shoulders · Triceps', list: [['Bench press', '4 × 6–8'], ['Overhead press', '3 × 8–10'], ['Incline dumbbell press', '3 × 10'], ['Lateral raises', '3 × 12–15'], ['Tricep pushdowns', '3 × 12']] },
  pull: { focus: 'Back · Biceps', list: [['Barbell rows', '4 × 8'], ['Seated cable row', '3 × 10'], ['Lat pulldown', '3 × 10'], ['Face pulls', '3 × 15'], ['Bicep curls', '3 × 12']] },
  legs: { focus: 'Quads · Hamstrings · Calves', list: [['Squats', '4 × 6–8'], ['Romanian deadlifts', '3 × 8–10'], ['Leg press', '3 × 12'], ['Walking lunges', '3 × 10 each'], ['Calf raises', '4 × 15']] }
};
const SECTIONS = {
  planner: { title: 'Planner', accent: '#202124', soft: '#E8EAED', btn: '#202124', ink: '#fff',
    glow: 'radial-gradient(60% 260px at 8% 0%, rgba(66,133,244,.30), rgba(66,133,244,0) 70%), radial-gradient(60% 260px at 38% 0%, rgba(234,67,53,.24), rgba(234,67,53,0) 70%), radial-gradient(60% 260px at 64% 0%, rgba(251,188,5,.30), rgba(251,188,5,0) 70%), radial-gradient(60% 260px at 94% 0%, rgba(52,168,83,.28), rgba(52,168,83,0) 70%)' },
  tasks:  { title: 'Tasks',  accent: '#B06000', soft: '#FEF7E0', btn: '#FBBC05', ink: '#202124', rgb: '251,188,5', a: .36 },
  work:   { title: 'Work',   accent: '#188038', soft: '#E6F4EA', btn: '#188038', ink: '#fff', rgb: '52,168,83', a: .30 },
  gym:    { title: 'Gym',    accent: '#D93025', soft: '#FCE8E6', btn: '#D93025', ink: '#fff', rgb: '234,67,53', a: .28 },
  school: { title: 'School', accent: '#1A73E8', soft: '#E8F0FE', btn: '#1A73E8', ink: '#fff', rgb: '66,133,244', a: .30 },
  news:   { title: 'News',   accent: '#B45309', soft: '#FEEFE3', btn: '#FA7B17', ink: '#202124', rgb: '250,123,23', a: .30 }
};
const TAB_ORDER = ['planner', 'tasks', 'work', 'gym', 'school', 'news'];
const NAV_ICONS = {
  planner: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  tasks: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  work: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gym: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  school: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  news: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/>'
};
const FEEDS = [
  { cat: 'wrestling', source: 'Cageside Seats', url: 'https://www.cagesideseats.com/rss/current.xml', site: 'https://www.cagesideseats.com' },
  { cat: 'wrestling', source: '411Mania', url: 'https://411mania.com/wrestling/feed/', site: 'https://411mania.com/wrestling/' },
  { cat: 'wrestling', source: 'Wrestling Inc', url: 'https://www.wrestlinginc.com/feed/', site: 'https://www.wrestlinginc.com' },
  { cat: 'games', source: 'IGN', url: 'https://feeds.feedburner.com/ign/all', site: 'https://www.ign.com' },
  { cat: 'games', source: 'GameSpot', url: 'https://www.gamespot.com/feeds/mashup/', site: 'https://www.gamespot.com' },
  { cat: 'games', source: 'Polygon', url: 'https://www.polygon.com/rss/index.xml', site: 'https://www.polygon.com' },
  { cat: 'baseball', source: 'D-backs', url: 'https://www.mlb.com/dbacks/feeds/news/rss.xml', site: 'https://www.mlb.com/dbacks' },
  { cat: 'baseball', source: 'Brewers', url: 'https://www.mlb.com/brewers/feeds/news/rss.xml', site: 'https://www.mlb.com/brewers' }
];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- date helpers (local time) ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
function dayLabel(s) {
  const t = todayStr();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  const d = parse(s);
  return DOW[d.getDay()] + ', ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ', ' + d.getFullYear() : '');
}
function shortDate(s) { const d = parse(s); return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h >= 12 ? 'pm' : 'am');
}
function hoursBetween(a, b) {
  const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d / 60;
}
function timeAgo(iso) {
  const t = new Date(iso.replace(' ', 'T')); if (isNaN(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return Math.max(1, m) + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}

/* ---------- saved data ---------- */
function defaults() {
  return {
    name: 'Rey',
    tasks: [],
    shifts: {},
    school: { term: 'WGU · Term 5', termEnd: '2027-04-30', courses: [
      { code: 'D281', name: 'Linux Foundations', pct: 0 },
      { code: 'D387', name: 'Advanced Java', pct: 0 },
      { code: 'D333', name: 'Ethics in Technology', pct: 0 },
      { code: 'D430', name: 'Intro to InfoSec', pct: 0 }
    ] },
    weights: {},
    plans: Object.fromEntries(Object.entries(PLANS).map(([k, p]) => [k, p.list.map(e => e.slice())])),
    news: { items: [], at: 0 }
  };
}
function load() {
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw) return Object.assign(defaults(), raw); } catch (e) {}
  return defaults();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
if (S.name === 'Ray') { S.name = 'Rey'; save(); }

/* ---------- screen state (not saved) ---------- */
const ui = {
  plannerSel: null, plannerMonth: null, filter: 'all', filterOpen: false, monthOpen: false, pickY: null,
  sheet: false, draft: '', tag: 'tasks', workout: null, pickDate: null, pickMonth: null,
  weekStart: null, workOpen: null, workStart: '09:00', workEnd: '17:00',
  split: null, gymView: 'workout', gymOpen: null, gymDraft: '', gymStart: '', exName: '', addingEx: false, newEx: '', chartEx: null,
  schoolOpen: null, addingClass: false, newCode: '', newName: '',
  newsTab: 'all', newsLoading: false, newsErr: false,
  undo: null
};

/* ---------- utils ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (d, size = 18, sw = 2.5) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const route = () => { const r = location.hash.replace('#', ''); return SECTIONS[r] ? r : 'planner'; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function chip(cat) { const c = CATS[cat]; return `<div class="chip" style="background:${c.bg};color:${c.fg}">${c.short}</div>`; }
function itemsOn(ds, filter) {
  const out = [];
  const sh = S.shifts[ds];
  if (sh && (filter === 'all' || filter === 'work')) out.push({ cat: 'work', title: 'Work shift', sub: 'Work · ' + fmtTime(sh.start) + ' – ' + fmtTime(sh.end) });
  S.tasks.filter(t => t.date === ds && (filter === 'all' || t.cat === filter))
    .forEach(t => out.push({ cat: t.cat, title: t.text, sub: CATS[t.cat].label + (t.workout ? ' · ' + WK[t.workout] : ''), done: t.done }));
  return out;
}
function staticRow(it) {
  return `<div class="row${it.done ? ' done' : ''}">${chip(it.cat)}<div class="rt"><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></div>${it.done ? `<div class="check" role="img" aria-label="Done">${CHECK}</div>` : ''}</div>`;
}
function calendar(y, m, opts) {
  const first = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate(), t = todayStr();
  let h = '<div class="cal">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="wd" aria-hidden="true">${d}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let d = 1; d <= count; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d);
    const cls = [ds === opts.sel ? 'sel' : '', ds === t ? 'today' : '', ds < t ? 'past' : ''].join(' ');
    const dots = opts.dots ? opts.dots(ds) : [];
    h += `<button type="button" class="${cls}" data-a="${opts.action}" data-v="${ds}" aria-label="${dayLabel(ds)}"${opts.disablePast && ds < t ? ' disabled' : ''}>${d}${opts.dots ? `<span class="dots">${dots.map(c => `<i style="background:${CATS[c].fg}"></i>`).join('')}</span>` : ''}</button>`;
  }
  return h + '</div>';
}

/* ---------- screens ---------- */
function planner() {
  const t = todayStr();
  const sel = ui.plannerSel || t;
  const now = new Date();
  const pm = ui.plannerMonth || { y: now.getFullYear(), m: now.getMonth() };
  const items = itemsOn(sel, ui.filter);
  const f = ui.filter;
  const fbStyle = f !== 'all' ? `background:${CATS[f].fg};color:#fff` : ui.filterOpen ? 'background:#202124;color:#fff' : '';
  const dotsFor = ds => CAT_ORDER.filter(c => (f === 'all' || f === c) && ((c === 'work' && S.shifts[ds]) || S.tasks.some(x => x.date === ds && x.cat === c)));
  let panel = '';
  if (ui.filterOpen) {
    panel = `<div class="pills" style="grid-template-columns:repeat(5,minmax(0,1fr))">` + ['all'].concat(CAT_ORDER).map(id => {
      const on = f === id;

function weekStartOf(s) { const d = parse(s); d.setDate(d.getDate() - d.getDay()); return ymd(d); }

function curWeight(ex) { const h = S.weights[ex]; return h && h.length ? h[h.length - 1].w : null; }
// One point per Sunday–Saturday week, from the first logged week to this week; empty weeks repeat the week before.
function weeklyWeights(ex) {
  const h = (S.weights[ex] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!h.length) return [];
  const byWeek = {}; h.forEach(p => { byWeek[weekStartOf(p.date)] = p.w; });
  const out = [], now = weekStartOf(todayStr());
  let w = null, n = 1;
  for (let s = weekStartOf(h[0].date); s <= now; s = addDays(s, 7), n++) {
    const logged = s in byWeek; if (logged) w = byWeek[s];
    out.push({ week: n, start: s, w, logged });
  }
  return out;
}
function nextWorkout() {
  const t = todayStr();
  return S.tasks.filter(x => x.cat === 'gym' && x.workout && x.date >= t && !x.done).sort((a, b) => a.date.localeCompare(b.date))[0];
}
function curSplit() { const nx = nextWorkout(); return ui.split || (nx ? nx.workout : 'push'); }
function gymScreen() {

  const header = `<header class="head"><div><div class="sub">${nx ? 'Next: ' + WK[nx.workout] + ' day · ' + dayLabel(nx.date) : 'No workouts planned — add one in Tasks'}</div><h1>Gym</h1></div></header>`;
  if (prog) {
    const groups = Object.keys(WK).map(w => [w, S.plans[w].map(e => e[0])]).filter(g => g[1].length);
    const all = groups.flatMap(g => g[1]);
    const ex = all.includes(ui.chartEx) ? ui.chartEx : (plan.list[0] || [])[0] || all[0];
    const hist = weeklyWeights(ex).slice(-8);

    else {
      const v = hist.map(p => p.w), lo = Math.min(...v) - 5, hi = Math.max(...v) + 5;
      const pts = v.map((w, i) => [hist.length === 1 ? 155 : 12 + i * (286 / (hist.length - 1)), 150 - (w - lo) / (hi - lo) * 130]);
      const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      const last = pts[pts.length - 1], gain = v[v.length - 1] - v[0];
      chart = `<div class="calhead" style="align-items:flex-end"><div><div class="lbl">${esc(ex)}</div><div style="font-size:30px;font-weight:800">${v[v.length - 1]} lb</div></div>${hist.length > 1 ? `<div class="stat" style="color:${gain >= 0 ? '#188038' : '#D93025'}">${gain >= 0 ? '+' : ''}${gain} lb</div>` : ''}</div>
        <svg viewBox="0 0 310 170" width="100%" role="img" aria-label="${esc(ex)} weight, ${v.join(', ')} pounds">
          <line x1="10" y1="20" x2="300" y2="20" stroke="#FCE8E6"/><line x1="10" y1="85" x2="300" y2="85" stroke="#FCE8E6"/><line x1="10" y1="150" x2="300" y2="150" stroke="#FCE8E6"/>
          ${hist.length > 1 ? `<polygon points="${line} ${last[0].toFixed(1)},150 ${pts[0][0].toFixed(1)},150" fill="#D93025" fill-opacity=".10"/><polyline points="${line}" fill="none" stroke="#D93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ''}

        <div class="note">Weeks run Sunday–Saturday. Your last save each week counts, and weeks you skip keep the week before's weight (shown in grey).</div>`;
    }
    return `<div class="scroll">
      ${header}
      ${seg}
      <section class="card">${chart}</section>
      ${groups.map(([w, names]) => `<div style="display:flex;flex-direction:column;gap:8px"><div class="lbl">${WK[w]}</div>

    </div>`;
  }
  return `<div class="scroll">
    ${header}
    ${seg}
    <section class="list"><h2>${plan.focus}</h2>${plan.list.length ? '' : '<div class="empty">No exercises yet.</div>'}${plan.list.map(([n], i) => {
      const open = ui.gymOpen === i, w = curWeight(n);

        <div class="rt"><b>${esc(n)}</b></div>

        ${open ? `<div class="expand">
          <label class="lbl" for="exn">Name</label><input id="exn" class="field" value="${esc(ui.exName)}" data-bind="exName" autocomplete="off">          <label class="lbl" for="wt">Weight (lb)</label><div class="stepper">
          <button type="button" class="round" data-a="step" data-v="-5" aria-label="Lower 5 pounds">−</button>
          <input id="wt" class="field" type="number" inputmode="decimal" step="2.5" min="0" value="${esc(ui.gymDraft)}" data-bind="gymDraft">
          <button type="button" class="round" data-a="step" data-v="5" aria-label="Raise 5 pounds">+</button></div>
          <div style="display:flex;gap:8px"><button type="button" class="btn main grow" data-a="saveEx" data-v="${i}">Save</button><button type="button" class="btn soft" data-a="delEx" data-v="${i}">Delete</button></div></div>` : ''}
      </div>`;
    }).join('')}
    ${ui.addingEx ? `<section class="card"><h2 style="font-size:16px">Add an exercise</h2>
      <label class="sr" for="nex">Exercise name</label><input id="nex" class="field" placeholder="Exercise name" value="${esc(ui.newEx)}" data-bind="newEx" autocomplete="off">

/* ---------- news loading ---------- */
async function loadNews(force) {
  if (ui.newsLoading) return;
  const haveCats = new Set(S.news.items.map(n => n.cat));
  if (!force && S.news.items.length && Date.now() - S.news.at < 60 * 60 * 1000 && FEEDS.every(f => haveCats.has(f.cat))) return;
  if (!force && ui.newsTried && Date.now() - ui.newsTried < 10 * 60 * 1000) return;
  ui.newsTried = Date.now();
  ui.newsLoading = true; ui.newsErr = false; render();
  const results = await Promise.allSettled(FEEDS.map(f =>
    fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url))
      .then(r => r.json())
      .then(j => (j.status === 'ok' ? j.items : []).slice(0, 10).map(it => {
        const d = document.createElement('textarea'); d.innerHTML = it.title || '';
        return { cat: f.cat, source: f.source, title: d.value, link: it.link, date: it.pubDate || '' };
      }))));
  const items = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value).filter(i => i.title && /^https?:/.test(i.link || ''));
  items.sort((a, b) => new Date((b.date || '').replace(' ', 'T')) - new Date((a.date || '').replace(' ', 'T')));
  if (items.length) { S.news = { items: items.slice(0, FEEDS.length * 10), at: Date.now() }; save(); } else ui.newsErr = true;
  ui.newsLoading = false; render();
}

/* ---------- actions ---------- */
const A = {
  planSel: v => { ui.plannerSel = v; },
  toggleFilter: () => { ui.filterOpen = !ui.filterOpen; ui.monthOpen = false; },
  setFilter: v => { ui.filter = v; ui.filterOpen = false; },
  toggleMonth: () => { const n = new Date(); ui.monthOpen = !ui.monthOpen; ui.filterOpen = false; ui.pickY = (ui.plannerMonth || { y: n.getFullYear() }).y; },
  pickYear: v => { ui.pickY += Number(v); },
  pickMonth: v => { ui.plannerMonth = { y: ui.pickY, m: Number(v) }; ui.monthOpen = false; ui.plannerSel = ui.pickY + '-' + pad(Number(v) + 1) + '-01'; },
  goToday: () => { ui.plannerMonth = null; ui.plannerSel = null; ui.monthOpen = false; },

  openSheet: () => { ui.sheet = true; ui.pickDate = todayStr(); ui.pickMonth = null; ui.workout = null; setTimeout(() => { const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; const el = document.getElementById('draft'); if (el) el.focus(); }, 50); },
  closeSheet: () => { ui.sheet = false; },
  setTag: v => { ui.tag = v; if (v !== 'gym') ui.workout = null; },
  setWorkout: v => { ui.workout = v; },
  pickDate: v => { ui.pickDate = v; },
  sheetMonth: v => {
    const base = ui.pickMonth || { y: parse(ui.pickDate || todayStr()).getFullYear(), m: parse(ui.pickDate || todayStr()).getMonth() };
    const d = new Date(base.y, base.m + Number(v), 1); ui.pickMonth = { y: d.getFullYear(), m: d.getMonth() };
  },
  addTask: () => {
    if (ui.tag === 'gym' && !ui.workout) return;
    const wk = ui.tag === 'gym' ? ui.workout : null;
    const text = ui.draft.trim() || (wk ? WK[wk] + ' day' : 'New task');
    S.tasks.push({ id: uid(), text, date: ui.pickDate || todayStr(), cat: ui.tag, workout: wk, done: false, created: Date.now() });
    save(); ui.sheet = false; ui.draft = ''; ui.workout = null;
  },
  toggleTask: v => { const x = S.tasks.find(t => t.id === v); if (x) { x.done = !x.done; save(); } },
  delTask: v => { const i = S.tasks.findIndex(t => t.id === v); if (i > -1) { ui.undo = { task: S.tasks[i], at: i }; S.tasks.splice(i, 1); save(); A._undoTimer(); } },
  undo: () => {
    if (!ui.undo) return;
    if (ui.undo.ex) S.plans[ui.undo.split].splice(ui.undo.at, 0, ui.undo.ex);
    else S.tasks.splice(ui.undo.at, 0, ui.undo.task);
    ui.undo = null; save();
  },
  _undoTimer: () => { clearTimeout(A._u); A._u = setTimeout(() => { ui.undo = null; render(); }, 5000); },

  week: v => { ui.weekStart = addDays(ui.weekStart || weekStartOf(todayStr()), Number(v)); ui.workOpen = null; },
  openDay: v => { if (ui.workOpen === v) { ui.workOpen = null; return; } ui.workOpen = v; const s = S.shifts[v]; ui.workStart = s ? s.start : '09:00'; ui.workEnd = s ? s.end : '17:00'; },
  saveShift: v => { if (ui.workStart && ui.workEnd) { S.shifts[v] = { start: ui.workStart, end: ui.workEnd }; save(); } ui.workOpen = null; },
  clearShift: v => { delete S.shifts[v]; save(); ui.workOpen = null; },

  setSplit: v => { ui.split = v; ui.gymView = 'workout'; ui.gymOpen = null; ui.addingEx = false; },
  gymView: v => { ui.gymView = v; ui.gymOpen = null; ui.addingEx = false; },
  chartEx: v => { ui.chartEx = v; },
  startEx: () => { ui.addingEx = true; ui.newEx = ''; ui.gymOpen = null; setTimeout(() => { const el = document.getElementById('nex'); if (el) el.focus(); }, 50); },
  cancelEx: () => { ui.addingEx = false; },
  addEx: () => { const n = ui.newEx.trim(); if (!n) return; S.plans[curSplit()].push([n, '']); ui.addingEx = false; save(); },
  openEx: v => {
    const i = Number(v); ui.addingEx = false; if (ui.gymOpen === i) { ui.gymOpen = null; return; }
    const n = S.plans[curSplit()][i][0], w = curWeight(n);
    ui.gymOpen = i; ui.exName = n; ui.gymDraft = ui.gymStart = w == null ? '' : String(w);
  },
  step: v => { ui.gymDraft = String(Math.max(0, (Number(ui.gymDraft) || 0) + Number(v))); },
  saveEx: v => {
    const ex = S.plans[curSplit()][Number(v)], old = ex[0];
    const name = ui.exName.trim() || old;
    if (name !== old && S.weights[old]) {
      // Carry the weight history over to the new name; keep the old key if another workout still uses it.
      S.weights[name] = (S.weights[name] || []).concat(S.weights[old]).sort((a, b) => a.date.localeCompare(b.date));
      if (!Object.values(S.plans).some(l => l.some(e => e !== ex && e[0] === old))) delete S.weights[old];
    }
    ex[0] = name;
    const w = Number(ui.gymDraft);
    if (ui.gymDraft !== ui.gymStart && ui.gymDraft !== '' && !isNaN(w)) {
      const h = S.weights[name] = S.weights[name] || []; const t = todayStr(), last = h[h.length - 1];
      if (last && weekStartOf(last.date) === weekStartOf(t)) { last.w = w; last.date = t; } else h.push({ date: t, w });
    }
    save(); ui.gymOpen = null;
  },
  delEx: v => {
    const split = curSplit(), at = Number(v);
    ui.undo = { ex: S.plans[split][at], split, at }; S.plans[split].splice(at, 1);
    save(); ui.gymOpen = null; A._undoTimer();
  },

  openClass: v => { ui.schoolOpen = ui.schoolOpen === Number(v) ? null : Number(v); },
  classPass: v => { S.school.courses[v].pct = 100; save(); },
  classReset: v => { S.school.courses[v].pct = 0; save(); },
  classDel: v => { S.school.courses.splice(Number(v), 1); ui.schoolOpen = null; save(); },
  startClass: () => { ui.addingClass = true; ui.newCode = ''; ui.newName = ''; },
  cancelClass: () => { ui.addingClass = false; },
  addClass: () => { if (!ui.newCode.trim() && !ui.newName.trim()) return; S.school.courses.push({ code: ui.newCode.trim().toUpperCase() || '—', name: ui.newName.trim() || 'New class', pct: 0 }); ui.addingClass = false; save(); },

  newsTab: v => { ui.newsTab = v; },
  refreshNews: () => { loadNews(true); }
};
const CHANGE = {
  daysLeft: el => { const n = Math.max(0, parseInt(el.value, 10) || 0); S.school.termEnd = addDays(todayStr(), n); save(); },
  classPct: el => { S.school.courses[el.dataset.v].pct = Number(el.value); save(); }
};

/* ---------- render ---------- */
const app = document.getElementById('app');
function render() {
  const r = route(), sec = SECTIONS[r];
  const keepScroll = render._route === r ? (app.querySelector('.scroll') || {}).scrollTop : 0;
  app.style.setProperty('--accent', sec.accent); app.style.setProperty('--soft', sec.soft);
  app.style.setProperty('--btn', sec.btn); app.style.setProperty('--btnInk', sec.ink);
  app.style.background = (sec.glow || `radial-gradient(130% 300px at 50% 0%, rgba(${sec.rgb},${sec.a}), rgba(${sec.rgb},0) 75%)`) + ', #F1F3F4';
  document.title = sec.title;
  const screen = { planner, tasks: tasksScreen, work: workScreen, gym: gymScreen, school: schoolScreen, news: newsScreen }[r]();
  const oldPill = app.querySelector('nav.tabs .glide');
  const fromX = oldPill ? new DOMMatrix(getComputedStyle(oldPill).transform).m41 : null;
  const nav = `<nav class="tabs" aria-label="Sections"><span class="glide" style="--i:${TAB_ORDER.indexOf(r)}"></span>${TAB_ORDER.map(k => `<a href="#${k}" class="${k === r ? 'on' : ''}"${k === r ? ' aria-current="page"' : ''}>${svg(NAV_ICONS[k], 22, 2)}${SECTIONS[k].title}</a>`).join('')}</nav>`;
  const toast = ui.undo ? `<div class="toast" role="status">${ui.undo.ex ? 'Exercise' : 'Task'} deleted<button type="button" data-a="undo">Undo</button></div>` : '';
  app.innerHTML = screen + nav + toast;
  // The nav is rebuilt every render, so start the new pill where the old one was and let it slide.
  const pill = app.querySelector('nav.tabs .glide');
  if (fromX !== null) { pill.style.transform = `translateX(${fromX}px)`; pill.getBoundingClientRect(); pill.style.transform = ''; }
  const sc = app.querySelector('.scroll'); if (sc && keepScroll) sc.scrollTop = keepScroll;
  render._route = r;
  if (r === 'news') loadNews(false);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.v, el); render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) ui[el.dataset.bind] = el.value;
  if (el.dataset.change === 'classPct') { const l = document.getElementById('prl'); if (l) l.textContent = el.value; }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CHANGE[el.dataset.change]) { CHANGE[el.dataset.change](el); render(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'draft' && !(ui.tag === 'gym' && !ui.workout)) { A.addTask(); render(); }
  if (e.target.id === 'nex') { A.addEx(); render(); }
});
window.addEventListener('hashchange', () => { ui.filterOpen = ui.monthOpen = false; render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
